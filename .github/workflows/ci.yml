name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch: { }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless check
        run: ./gradlew spotlessCheck --continue

      - name: Unit tests (shared, JVM)
        run: ./gradlew :shared:core:jvmTest :shared:logic:jvmTest :shared:ui:jvmTest

      - name: Build FOSS debug APK
        run: ./gradlew :androidApp:assembleFossDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: grit-foss-debug
          path: androidApp/build/outputs/apk/foss/debug/*.apk
          retention-days: 14
